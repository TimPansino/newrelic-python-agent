---
name: Trivy

on:
  pull_request:
  schedule:
    - cron: "0 15 * * *"

concurrency:
  group: ${{ github.ref || github.run_id }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Upload Trivy data
  trivy:
    name: Scan for Vulnerabilities and Upload Results
    if: success() || failure() # Does not run on cancelled workflows
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # Upload SARIF results to code scanning

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.4
        with:
          disable-sudo: true
          egress-policy: audit

      # Git Checkout
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Repository on PR (Table)
        if: ${{ github.event_name == 'pull_request' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: table
          exit-code: 1
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          trivyignores: ".github/.trivyignore"

      - name: Scan Repository on Schedule (SARIF)
        if: ${{ github.event_name == 'schedule' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          trivyignores: ".github/.trivyignore"

      - name: Upload Scan Results to Security Tab
        if: ${{ github.event_name == 'schedule' }}
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: "trivy-results.sarif"
